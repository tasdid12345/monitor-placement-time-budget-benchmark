name: run-analysis
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run analysis
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ( pip install -r requirements.txt && timeout 25m python analysis.py ) > run.log 2>&1
          echo $? > exit_code.txt
          tail -c 200000 run.log > run.tmp && mv run.tmp run.log
          exit 0
      - name: Save outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add run.log exit_code.txt
          [ -f results.json ] && git add results.json
          [ -d figures ] && git add figures
          git commit -m "Add analysis results" || echo "nothing to commit"
          git push
